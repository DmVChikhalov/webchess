<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebChess — обучающие шахматы</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WebChess">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ЭКРАН НАСТРОЙКИ -->
<div id="setup-screen" class="screen">
    <div class="setup-card">
        <h1>♞ WebChess</h1>
        <div id="rating-badge" class="rating-badge"></div>
        <p class="subtitle">Обучающие шахматы со Stockfish — играй, учи дебюты, решай задачи и расти в рейтинге.</p>

        <!-- Шаг 1: режим -->
        <div id="setup-step1">
            <fieldset>
                <legend>Режим</legend>
                <label class="radio-card">
                    <input type="radio" name="mode" value="training" checked>
                    <span class="rc-icon">🎓</span>
                    <span>Тренировка<small>Разбор каждого хода: дебютная теория, идея, перспектива, сноски из книг</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="mode" value="casual">
                    <span class="rc-icon">⚔️</span>
                    <span>Обычная игра<small>Честная партия против Stockfish без подсказок; уровень силы — от новичка до максимума</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="mode" value="openings">
                    <span class="rc-icon">📚</span>
                    <span>Дебюты<small>Сначала выбери дебют и цвет, затем занятие: учить с подсказками, тренировать по памяти или свободно разбирать</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="mode" value="puzzles">
                    <span class="rc-icon">🧩</span>
                    <span>Задачи<small>Маты и тактика из учебников; решение растит рейтинг, ошибки снимают</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="mode" value="theory">
                    <span class="rc-icon">🎓</span>
                    <span>Теория<small>Пошаговый учебник с показом на доске: от правил и ходов до продвинутой стратегии</small></span>
                </label>
            </fieldset>
            <button id="btn-continue" class="btn-primary">Продолжить</button>
        </div>

        <!-- Шаг 2: параметры выбранного режима (цвет — только там, где он есть) -->
        <div id="setup-step2" class="hidden">
            <div id="learn-picker" class="learn-picker hidden">
                <label for="learn-opening">Дебют (по популярности в 2026):</label>
                <select id="learn-opening"></select>
                <div id="variation-picker" class="variation-picker"></div>
                <div id="learn-preview" class="learn-preview"></div>
            </div>
            <fieldset id="difficulty-fieldset" class="hidden">
                <legend>Сложность соперника</legend>
                <label class="radio-card">
                    <input type="radio" name="difficulty" value="novice">
                    <span class="rc-icon">🐣</span><span>Новичок<small>≈1000 эло — прощает ошибки</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="difficulty" value="club" checked>
                    <span class="rc-icon">🎯</span><span>Средний<small>≈1500 эло — крепкий клубный игрок</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="difficulty" value="strong">
                    <span class="rc-icon">🔥</span><span>Максимум<small>≈2300 эло — уровень мастера</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="difficulty" value="impossible">
                    <span class="rc-icon">💀</span><span>Невозможный<small>Stockfish на полной силе — не выигрывают и гроссмейстеры</small></span>
                </label>
            </fieldset>
            <fieldset id="color-fieldset">
                <legend>Ваш цвет (вы всегда снизу)</legend>
                <label class="radio-card">
                    <input type="radio" name="color" value="w" checked>
                    <span class="rc-icon rc-king-white">♚</span><span>Белые</span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="color" value="b">
                    <span class="rc-icon rc-king-black">♚</span><span>Чёрные</span>
                </label>
            </fieldset>
            <p class="hint" id="setup-hint"></p>
            <div class="setup-actions">
                <button id="btn-back-step" class="btn-secondary">← Назад</button>
                <button id="btn-start" class="btn-primary">Начать партию</button>
            </div>
        </div>

        <!-- Шаг 2а (только «Дебюты»): СНАЧАЛА выбираем занятие, потом дебют и цвет -->
        <div id="setup-step3" class="hidden">
            <fieldset>
                <legend>Как занимаемся</legend>
                <label class="radio-card">
                    <input type="radio" name="openings-submode" value="learn" checked>
                    <span class="rc-icon">📖</span>
                    <span>Учить<small>Тренажёр говорит каждый ход (подсветка на доске) и объясняет почему</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="openings-submode" value="drill">
                    <span class="rc-icon">🎯</span>
                    <span>Тренировать по памяти<small>Играешь линию сам; неверный ход не проходит, подсказки нарастают с ошибками</small></span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="openings-submode" value="tutor">
                    <span class="rc-icon">🧭</span>
                    <span>Свободный разбор<small>Ходишь за обе стороны; панель показывает дебют, стратегию, статистику и выходы</small></span>
                </label>
            </fieldset>
            <div class="setup-actions">
                <button id="btn-back-step3" class="btn-secondary">← Назад</button>
                <button id="btn-continue3" class="btn-primary">Продолжить</button>
            </div>
        </div>
        <div id="engine-status" class="engine-status">Загрузка движка…</div>
        <p class="progress-note">Рейтинг и прогресс сохраняются на этом устройстве автоматически.</p>
    </div>
</div>

<!-- ЭКРАН ИГРЫ -->
<div id="game-screen" class="screen hidden">
    <div class="game-layout">

        <div class="board-column">
            <div class="board-header">
                <span id="mode-badge" class="badge"></span>
                <span id="turn-indicator"></span>
            </div>
            <div id="captured-top" class="captured-bar"></div>
            <div class="board-wrap">
                <div id="eval-bar"><div id="eval-fill"></div><span id="eval-label">…</span></div>
                <div class="board-frame">
                    <div id="board"></div>
                    <svg id="arrow-layer" viewBox="0 0 8 8" preserveAspectRatio="none"></svg>
                    <div id="promotion-overlay" class="hidden"></div>
                </div>
            </div>
            <div id="captured-bottom" class="captured-bar"></div>
            <div id="pos-stats" class="pos-stats hidden"></div>
            <div id="game-status" class="game-status hidden"></div>
            <div class="controls">
                <button id="btn-engine-move" class="btn-primary">⚡ Ход Stockfish</button>
                <button id="btn-undo" class="btn-secondary">↩ Назад</button>
                <button id="btn-new-game" class="btn-secondary">☰ Меню</button>
            </div>
        </div>

        <div class="panel-column">
            <div class="panel-tabs">
                <button class="ptab active" data-tab="analysis">🧠 Анализ</button>
                <button class="ptab" data-tab="moves">📜 Ходы</button>
            </div>
            <div id="tab-analysis" class="tab-page">
                <div id="tutor-box" class="panel-box hidden"></div>
                <div id="recommend-box" class="panel-box"></div>
                <div id="review-box" class="panel-box"></div>
            </div>
            <div id="tab-moves" class="tab-page hidden">
                <div class="panel-box">
                    <h3>Ходы партии</h3>
                    <div id="history-box" class="history history-tall"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="drill-modal" class="modal-overlay hidden"></div>

<script src="lib/chess.js"></script>
<script src="js/openings.js"></script>
<script src="js/strategies.js"></script>
<script src="js/drills.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/theory.js"></script>
<script src="js/explain.js"></script>
<script src="js/app.js"></script>
</body>
</html>
